[metadata]
name = groovi
url = https://github.com/PopicLab/groovi
description = Graph learning framework for structural variant discovery
long_description = file: README.md
long_description_content_type = text/markdown
version = attr: groovi.__version__

[options]
requires_python >=3.9
install_requires =
    biopython
    numpy
    pysam
    pyyaml
packages = find:

[options.packages.find]
include =
    cli
    gnn
    graph
    seq

[options.entry_points]
console_scripts =
    groovi = groovi.__main__:main
