[metadata]
name = groovi
url = https://github.com/PopicLab/groovi
description = Graph learning framework for structural variant discovery
long_description = file: README.md
long_description_content_type = text/markdown
version = attr: groovi.__version__

[options]
requires_python >=3.9
install_requires =
    bitarray==2.9.2
    dgl==2.1.0
    intervaltree==3.1.0
    joblib==1.4.2
    mappy==2.28
    matplotlib==3.9.1
    numpy==1.24.4
    opencv-python==4.10.0.84
    pandas==2.2.0
    pycocotools==2.0.8
    pydantic
    pysam==0.22.1
    pyvis
    PyYAML==6.0.1
    scikit-learn
    scipy==1.13.1
    torch==2.0.1
    torchdata==0.7.1
    torchvision==0.15.2
    tqdm==4.66.4
packages = find:

[options.packages.find]
include =
    cli
    gnn
    graph
    seq

[options.entry_points]
console_scripts =
    groovi = groovi.__main__:main
