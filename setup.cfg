[metadata]
name = groovi
url = https://github.com/PopicLab/groovi
description = Graph learning framework for complex structural variant discovery
version = attr: groovi.__version__

[options]
requires_python ">=3.10"
install_requires =
    pycues @ git+https://github.com/PopicLab/cues.git@main#subdirectory=cues
    dgl==2.1.0
    intervaltree==3.1.0
    matplotlib
    numpy<2
    pydantic
    pysam==0.22.1
    pyvis
    PyYAML
    scikit-learn
    scipy
    seaborn
    tensorboardX
    torch==2.0.1
    torchdata==0.7.1
    tqdm
packages = find:

[options.packages.find]
include =
    groovi
    groovi.*

[options.entry_points]
console_scripts =
    groovi = groovi.__main__:main
